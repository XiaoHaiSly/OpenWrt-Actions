#CI项目
name: LIBWRT-QCA

#CI计划
on:
  #自动编译：当Auto-Clean运行完成后
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      #max-parallel: 3
      matrix:
        CONFIG: [IPQ60XX, IPQ807X]
        SOURCE: [XiaoHaiSly/LibWrt]
        BRANCH: [25.12-nss]
        include:
          #编译用户态插件（同架构通用）
          - CONFIG: IPQ60XX
            FEED_USER: true
          - CONFIG: IPQ807X
            FEED_USER: false

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: argon
      #默认主机名
      WRT_NAME: LibWrt
      #默认WIFI名称
      WRT_SSID: LibWrt
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #用户态插件
      WRT_FEED_USER: ${{matrix.FEED_USER}}
      #软件源域名
      WRT_FEED_HOST: &FEED_HOST 'openwrt-feeds.pages.dev'
      #排除的内核模块
      WRT_KMOD_EXCLUDE: 'kmod-ath10k-sdio'

  #调用公用软件源发布WRT-PUBLISH.yml
  publish:
    name: Publish Feed
    needs: config
    uses: ./.github/workflows/WRT-PUBLISH.yml
    with:
      WRT_FEED_HOST: *FEED_HOST
    secrets: inherit
